name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Valores fake apenas para o build/typecheck. O build usa paginas dinamicas
      # e nao conecta ao banco. Secrets reais ficam no ambiente de deploy.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/cynthiamakes?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret-with-32-characters-min"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
